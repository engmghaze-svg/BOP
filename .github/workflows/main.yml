name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p "$(dirname 'BopForwarder/app/build.gradle')"
          cat > 'BopForwarder/app/build.gradle' <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.bopforwarder'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.bopforwarder"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/app/src/main/AndroidManifest.xml')"
          cat > 'BopForwarder/app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <application
                  android:label="BOP Forwarder"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".SmsReceiver" android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/app/src/main/java/com/example/bopforwarder/MainActivity.kt')"
          cat > 'BopForwarder/app/src/main/java/com/example/bopforwarder/MainActivity.kt' <<'EOF_FILE'
          package com.example.bopforwarder

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  requestPermissions(arrayOf(Manifest.permission.RECEIVE_SMS, Manifest.permission.SEND_SMS), 1)
                  val p = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  fun field(hint: String, value: String, phone: Boolean = false) = EditText(this).apply {
                      this.hint = hint; setText(value); gravity = Gravity.START
                      if (phone) inputType = InputType.TYPE_CLASS_PHONE
                      root.addView(this)
                  }
                  val target = field("رقم الهاتف المستلم (مثال +970599000000)", p.getString("target", "") ?: "", true)
                  val sender = field("اسم المرسل", p.getString("sender", "BOP") ?: "BOP")
                  val keyword = field("كلمة مفتاحية (اختياري)", p.getString("keyword", "") ?: "")
                  val sw = Switch(this).apply { text = "تفعيل التحويل"; isChecked = p.getBoolean("enabled", false); root.addView(this) }
                  Button(this).apply {
                      text = "حفظ"
                      setOnClickListener {
                          p.edit().putString("target", target.text.toString().trim())
                              .putString("sender", sender.text.toString().trim())
                              .putString("keyword", keyword.text.toString().trim())
                              .putBoolean("enabled", sw.isChecked).apply()
                          Toast.makeText(this@MainActivity, "تم الحفظ", Toast.LENGTH_SHORT).show()
                      }
                      root.addView(this)
                  }
                  setContentView(root)
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/app/src/main/java/com/example/bopforwarder/SmsReceiver.kt')"
          cat > 'BopForwarder/app/src/main/java/com/example/bopforwarder/SmsReceiver.kt' <<'EOF_FILE'
          package com.example.bopforwarder

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Telephony
          import android.telephony.SmsManager

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return
                  val p = context.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  if (!p.getBoolean("enabled", false)) return
                  val target = p.getString("target", "") ?: ""
                  val sender = (p.getString("sender", "BOP") ?: "BOP").trim()
                  val keyword = (p.getString("keyword", "") ?: "").trim()
                  if (target.isEmpty()) return

                  val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent) ?: return
                  if (msgs.isEmpty()) return
                  val from = msgs[0].originatingAddress ?: return
                  if (!from.equals(sender, ignoreCase = true)) return
                  val body = msgs.joinToString("") { it.messageBody ?: "" }
                  if (keyword.isNotEmpty() && !body.contains(keyword, ignoreCase = true)) return

                  val sms = if (Build.VERSION.SDK_INT >= 31)
                      context.getSystemService(SmsManager::class.java) else @Suppress("DEPRECATION") SmsManager.getDefault()
                  val parts = sms.divideMessage("[$from] $body")
                  sms.sendMultipartTextMessage(target, null, parts, null, null)
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/build.gradle')"
          cat > 'BopForwarder/build.gradle' <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/gradle.properties')"
          cat > 'BopForwarder/gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'BopForwarder/settings.gradle')"
          cat > 'BopForwarder/settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BopForwarder"
          include(":app")
          EOF_FILE
      - name: Build
        working-directory: BopForwarder
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BopForwarder-apk
          path: BopForwarder/app/build/outputs/apk/debug/app-debug.apk
